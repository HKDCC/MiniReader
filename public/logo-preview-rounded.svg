<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mini Reader rounded logo preview</title>
  <desc id="desc">A rounded app icon with a white center, black contour and MUJI red bookmark.</desc>

  <!-- Rounded icon casing: the black edge stays narrow so white remains dominant. -->
  <rect x="36" y="36" width="440" height="440" rx="124" fill="#000000"/>
  <rect x="60" y="60" width="392" height="392" rx="104" fill="#FFFFFF"/>

  <!-- Offset black back cover / page block. -->
  <path d="M111 190c0-28 22-50 50-50h85c22 0 40 7 54 22v211c-14-15-32-22-54-22h-85c-28 0-50-22-50-50V190Z" fill="#000000"/>
  <path d="M401 190c0-28-22-50-50-50h-85c-22 0-40 7-54 22v211c14-15 32-22 54-22h85c28 0 50-22 50-50V190Z" fill="#000000"/>

  <!-- White pages sit forward of the black back cover. -->
  <path d="M102 178c0-28 22-50 50-50h85c22 0 40 7 54 22v211c-14-15-32-22-54-22h-85c-28 0-50-22-50-50V178Z" fill="#FFFFFF" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M410 178c0-28-22-50-50-50h-85c-22 0-40 7-54 22v211c14-15 32-22 54-22h85c28 0 50-22 50-50V178Z" fill="#FFFFFF" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

  <!-- Minimal page marks. -->
  <path d="M137 208h104M137 245h72M137 282h104M375 208H271M375 245h-72M375 282H271" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Red bookmark. -->
  <path d="M306 115h54v176l-27-25-27 25V115Z" fill="#A6192E"/>
  <path d="M306 115h54" stroke="#000000" stroke-width="8"/>

  <!-- Binding crease and grounding mark. -->
  <path d="M256 153v211" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  <path d="M190 414h132" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
</svg>
